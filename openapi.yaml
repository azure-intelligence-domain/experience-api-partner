openapi: 3.0.3
info:
  title: '[Channel] Partner Experience API'
  version: 1.0.0
  description: 'What the 3PL partner (speedy-3pl) does on the platform: see its bookings (its work list), report
    a pick-up and a delivery. No code of its own: the gateway serves these operations of the 3PL System API under
    /partner, for the partner''s sign-in. In the demo, staff signed in with Google play the partner through the
    customer portal (ADR 0017).'
  contact:
    name: Channel Team
    url: https://github.com/azure-intelligence-domain/experience-api-partner
  license:
    name: MIT
    url: https://github.com/azure-intelligence-domain/experience-api-partner/blob/main/LICENSE
  x-gateway: other
x-gateway: other
externalDocs:
  description: EventCatalog entry of the channel domain
  url: https://azure-intelligence-domain.github.io/eventcatalog/docs/domains/channel/1.0.0
servers:
- url: https://apim-intplat-demo.azure-api.net/partner
  description: Main gateway, product partners. No version in the URI.
security:
- staffToken: []
- platformToken: []
tags:
- name: Partner
  description: The 3PL partner's bookings and notices.
paths:
  /shipment-bookings:
    x-summary: Shipment Bookings
    get:
      tags:
      - Partner
      operationId: retrieveListOfShipmentBookings
      summary: Retrieve List of Shipment Bookings
      description: 'The partner''s bookings, newest first, optionally only one status: status=booked is its work
        list.'
      parameters:
      - $ref: '#/components/parameters/bookingStatus'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The bookings.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/shipmentBookingList'
              example:
                _links:
                  self:
                    href: /shipment-bookings?status=booked
                totalCount: 1
                _embedded:
                  shipmentBookings:
                  - _links:
                      self:
                        href: /shipment-bookings/SPD-004711
                    shipmentId: SPD-004711
                    orderId: '4711'
                    customerId: ACME
                    partnerId: speedy-3pl
                    status: booked
                    trackingNumber: SPD4711BE
                    deliveryAddress:
                      street: Rue de la Loi 16
                      postalCode: '1000'
                      city: Brussels
                      countryCode: BE
                    orderLines:
                    - productId: SKU-1042
                      quantity: 12
                    requestedDeliveryDate: '2026-10-09'
                    bookedAt: '2026-10-03T09:16:00Z'
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /shipment-bookings?status=booked
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /shipment-bookings
      x-business-keys: {}
  /shipment-bookings/{shipmentId}:
    x-summary: Shipment Booking
    get:
      tags:
      - Partner
      operationId: retrieveShipmentBooking
      summary: Retrieve Shipment Booking
      description: One booking.
      parameters:
      - $ref: '#/components/parameters/shipmentId'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The booking.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/shipmentBooking'
              example:
                _links:
                  self:
                    href: /shipment-bookings/SPD-004711
                shipmentId: SPD-004711
                orderId: '4711'
                customerId: ACME
                partnerId: speedy-3pl
                status: booked
                trackingNumber: SPD4711BE
                deliveryAddress:
                  street: Rue de la Loi 16
                  postalCode: '1000'
                  city: Brussels
                  countryCode: BE
                orderLines:
                - productId: SKU-1042
                  quantity: 12
                requestedDeliveryDate: '2026-10-09'
                bookedAt: '2026-10-03T09:16:00Z'
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /shipment-bookings/SPD-004711
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /shipment-bookings/{shipmentId}
        '404':
          description: The partner has no booking with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/not-found.md
                title: Booking Not Found
                status: 404
                detail: The partner has no booking with this id.
                instance: /shipment-bookings/SPD-004711
      x-business-keys: {}
  /shipment-bookings/{shipmentId}/pick-up:
    x-summary: Shipment Pick Up
    post:
      tags:
      - Partner
      operationId: recordPickUp
      summary: Record Pick Up
      description: 'The partner''s pick-up notice: the booked consignment left the warehouse and is a shipment now.
        Publishes ShipmentDispatched. A repeated notice changes nothing.'
      parameters:
      - $ref: '#/components/parameters/shipmentId'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The shipment, dispatched.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/shipment'
              example:
                _links:
                  self:
                    href: /shipments/SPD-004711
                shipmentId: SPD-004711
                orderId: '4711'
                customerId: ACME
                partnerId: speedy-3pl
                status: dispatched
                trackingNumber: SPD4711BE
                dispatchedAt: '2026-10-04T07:30:00Z'
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /shipment-bookings/SPD-004711/pick-up
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /shipment-bookings/{shipmentId}/pick-up
        '404':
          description: The partner has no booking with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/not-found.md
                title: Booking Not Found
                status: 404
                detail: The partner has no booking with this id.
                instance: /shipment-bookings/SPD-004711/pick-up
        '409':
          description: The booking was cancelled; there is nothing to pick up.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/booking-cancelled.md
                title: Booking Cancelled
                status: 409
                detail: The booking was cancelled; there is nothing to pick up.
                instance: /shipment-bookings/SPD-004711/pick-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pickUpNotice'
            example:
              pickedUpAt: '2026-10-04T07:30:00Z'
      x-business-keys: {}
  /shipments/{shipmentId}:
    x-summary: Shipment
    get:
      tags:
      - Partner
      operationId: retrieveShipment
      summary: Retrieve Shipment
      description: 'One shipment: a consignment the partner picked up. A booking not picked up yet is not a shipment
        (404).'
      parameters:
      - $ref: '#/components/parameters/shipmentId'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The shipment.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/shipment'
              example:
                _links:
                  self:
                    href: /shipments/SPD-004711
                shipmentId: SPD-004711
                orderId: '4711'
                customerId: ACME
                partnerId: speedy-3pl
                status: dispatched
                trackingNumber: SPD4711BE
                dispatchedAt: '2026-10-04T07:30:00Z'
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /shipments/SPD-004711
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /shipments/{shipmentId}
        '404':
          description: The partner has no shipment with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/not-found.md
                title: Shipment Not Found
                status: 404
                detail: The partner has no shipment with this id.
                instance: /shipments/SPD-004711
      x-business-keys: {}
  /shipments/{shipmentId}/delivery:
    x-summary: Shipment Delivery
    post:
      tags:
      - Partner
      operationId: recordDelivery
      summary: Record Delivery
      description: 'The partner''s delivery notice: the customer received the shipment. Publishes ShipmentDelivered.
        A repeated notice changes nothing.'
      parameters:
      - $ref: '#/components/parameters/shipmentId'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The shipment, delivered.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/shipment'
              example:
                _links:
                  self:
                    href: /shipments/SPD-004711
                shipmentId: SPD-004711
                orderId: '4711'
                customerId: ACME
                partnerId: speedy-3pl
                status: delivered
                trackingNumber: SPD4711BE
                dispatchedAt: '2026-10-04T07:30:00Z'
                deliveredAt: '2026-10-08T14:10:00Z'
                receivedBy: J. Peeters
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /shipments/SPD-004711/delivery
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /shipments/{shipmentId}/delivery
        '404':
          description: The partner has no shipment with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/system-api-3pl/blob/main/docs/problems/not-found.md
                title: Shipment Not Found
                status: 404
                detail: The partner has no shipment with this id.
                instance: /shipments/SPD-004711/delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deliveryNotice'
            example:
              receivedBy: J. Peeters
      x-business-keys: {}
components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Google ID token for the customer portal''s OAuth client, of a Google Workspace account of
        the staff domain (routing/staff.yaml in integration-platform; ADR 0017). In production: the partner''s own
        identity.'
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Entra ID token for the intplat-platform-apis application, of a building block on the platform's
        allow-list (the journey test).
  parameters:
    correlationId:
      name: Correlation-Id
      in: header
      required: true
      description: The business journey this call belongs to, for example ord-4711.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
      example: ord-4711
    shipmentId:
      name: shipmentId
      in: path
      required: true
      description: Shipment id, e.g. SPD-004711.
      schema:
        type: string
        pattern: ^SPD-[0-9]+$
      example: SPD-004711
    bookingStatus:
      name: status
      in: query
      required: false
      description: Only bookings with this status, e.g. booked (the partner's work list).
      schema:
        type: string
        enum:
        - booked
        - pickedUp
        - cancelled
      example: booked
  schemas:
    deliveryAddress:
      type: object
      description: Delivery address.
      required:
      - street
      - postalCode
      - city
      - countryCode
      properties:
        street:
          type: string
          description: Street and number.
        postalCode:
          type: string
          description: Postal code.
        city:
          type: string
          description: City.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: ^[A-Z]{2}$
    deliveryNotice:
      type: object
      description: The partner's notice that the consignment was delivered.
      properties:
        deliveredAt:
          type: string
          description: When; now if omitted. ISO 8601, UTC.
          format: date-time
        receivedBy:
          type: string
          description: Who signed for it.
    pickUpNotice:
      type: object
      description: The partner's notice that it picked up the consignment.
      properties:
        pickedUpAt:
          type: string
          description: When; now if omitted. ISO 8601, UTC.
          format: date-time
    shipmentBooking:
      type: object
      description: A consignment booked with the partner, before and after pick-up.
      required:
      - _links
      - shipmentId
      - orderId
      - partnerId
      - status
      - trackingNumber
      - deliveryAddress
      - orderLines
      - bookedAt
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        shipmentId:
          type: string
          description: Consignment id.
        orderId:
          type: string
          description: The order.
        customerId:
          type: string
          description: The consignee.
        partnerId:
          type: string
          description: The 3PL partner.
        status:
          type: string
          description: 'Lifecycle: booked, then picked up (a shipment) or cancelled.'
          enum:
          - booked
          - pickedUp
          - cancelled
        trackingNumber:
          type: string
          description: Tracking number.
        deliveryAddress:
          $ref: '#/components/schemas/deliveryAddress'
        orderLines:
          type: array
          description: What to ship.
          items:
            type: object
            description: A line of the order.
            required:
            - productId
            - quantity
            properties:
              productId:
                type: string
                description: The product, e.g. SKU-1042.
              quantity:
                type: integer
                description: Units.
                minimum: 1
        requestedDeliveryDate:
          type: string
          description: Requested delivery date. ISO 8601.
          format: date
        bookedAt:
          type: string
          description: Booked. ISO 8601, UTC.
          format: date-time
        pickedUpAt:
          type: string
          description: Picked up. ISO 8601, UTC.
          format: date-time
        cancelledAt:
          type: string
          description: Cancelled. ISO 8601, UTC.
          format: date-time
        cancellationReason:
          type: string
          description: Why it was cancelled.
    shipmentBookingList:
      type: object
      description: Bookings.
      required:
      - _links
      - totalCount
      - _embedded
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        totalCount:
          type: integer
          description: Number of bookings.
          minimum: 0
        _embedded:
          type: object
          description: The bookings.
          required:
          - shipmentBookings
          properties:
            shipmentBookings:
              type: array
              description: Bookings.
              items:
                $ref: '#/components/schemas/shipmentBooking'
    shipment:
      type: object
      description: A shipment with the partner.
      required:
      - _links
      - shipmentId
      - orderId
      - partnerId
      - status
      - trackingNumber
      - dispatchedAt
      properties:
        _links:
          type: object
          description: HAL links.
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/halLink'
        shipmentId:
          type: string
          description: Consignment id.
        orderId:
          type: string
          description: The order.
        customerId:
          type: string
          description: The consignee.
        partnerId:
          type: string
          description: The 3PL partner.
        status:
          type: string
          description: Lifecycle.
          enum:
          - dispatched
          - delivered
        trackingNumber:
          type: string
          description: Tracking number.
        dispatchedAt:
          type: string
          description: Picked up. ISO 8601, UTC.
          format: date-time
        deliveredAt:
          type: string
          description: Delivered. ISO 8601, UTC.
          format: date-time
        receivedBy:
          type: string
          description: Who signed for it.
    halLink:
      type: object
      description: A HAL link.
      required:
      - href
      properties:
        href:
          type: string
          description: URI relative to the API root.
    problemDetail:
      type: object
      description: Problem Details (RFC 9457).
      required:
      - title
      - detail
      properties:
        type:
          type: string
          description: Problem type.
          format: uri
        title:
          type: string
          description: Summary.
        status:
          type: integer
          description: HTTP status.
        detail:
          type: string
          description: This occurrence.
        instance:
          type: string
          description: Request URI.
